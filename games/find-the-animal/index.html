<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="theme-color"
    content="#fff8ee"
  />

  <title>
    Find the Animal | Little Learners
  </title>

  <link
    rel="stylesheet"
    href="../../css/game-master.css"
  />

</head>


<body>

  <main class="game-shell">


    <!-- HEADER -->

    <header class="game-topbar">

      <a
        href="../../index.html"
        class="game-home-button"
        aria-label="Go back home"
      >
        ←
      </a>


      <div class="game-heading">

        <span
          class="game-heading-icon"
          aria-hidden="true"
        >
          🐶
        </span>


        <div>

          <h1>
            Find the Animal
          </h1>

          <p>
            Ages 2–4
          </p>

        </div>

      </div>


      <button
        id="soundButton"
        class="game-sound-button"
        type="button"
        aria-label="Turn sound off"
      >
        🔊
      </button>

    </header>



    <!-- START SCREEN -->

    <section
      id="startScreen"
      class="game-screen game-center-screen"
    >

      <div
        class="game-start-icon"
        aria-hidden="true"
      >
        🐶
      </div>


      <h2>
        Ready to play?
      </h2>


      <p>
        Listen carefully and find the right animal.
      </p>


      <button
        id="startButton"
        class="game-primary-button"
        type="button"
      >
        Start Game
      </button>

    </section>



    <!-- PLAY SCREEN -->

    <section
      id="playScreen"
      class="game-screen game-play-screen is-hidden"
    >


      <div class="game-meta">

        <span
          id="roundLabel"
          class="game-round-label"
        >
          Round 1 of 8
        </span>


        <button
          id="repeatButton"
          class="game-repeat-button"
          type="button"
        >
          🔊 Hear Again
        </button>

      </div>



      <!-- VISIBLE INSTRUCTION -->

      <h2
        id="prompt"
        class="game-prompt"
      ></h2>



      <!-- PARENT MODE SELECTOR -->

      <div
        class="game-mode-selector"
        aria-label="Animal learning mode"
      >

        <button
          id="animalsOnlyButton"
          class="game-mode-button is-active"
          type="button"
        >
          🐾 Animals Only
        </button>


        <button
          id="animalSoundsButton"
          class="game-mode-button"
          type="button"
        >
          🔊 With Fun Sounds
        </button>

      </div>



      <div
        id="feedback"
        class="game-feedback"
        aria-live="polite"
      ></div>



      <div
        id="animalChoices"
        class="game-choices"
        aria-label="Animal choices"
      ></div>



      <div class="game-progress-track">

        <div
          id="progressBar"
          class="game-progress-bar"
        ></div>

      </div>

    </section>



    <!-- FINISH SCREEN -->

    <section
      id="finishScreen"
      class="game-screen game-center-screen is-hidden"
    >

      <div
        class="game-finish-icon"
        aria-hidden="true"
      >
        ⭐
      </div>


      <h2>
        All done!
      </h2>


      <p>
        Great job learning your animals!
      </p>


      <div class="game-finish-actions">

        <button
          id="playAgainButton"
          class="game-primary-button"
          type="button"
        >
          Play Again
        </button>


        <a
          href="../../index.html"
          class="game-secondary-button"
        >
          Home
        </a>

      </div>

    </section>



    <!-- CELEBRATION -->

    <div
      id="celebrationLayer"
      class="game-celebration-layer"
      aria-hidden="true"
    ></div>


  </main>


  <script src="../../js/game-common.js"></script>

  <script src="game.js"></script>

</body>

</html>
