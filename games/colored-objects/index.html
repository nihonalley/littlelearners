<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#fff8ee">
    <title>Colored Objects | Little Learners</title>
    <link rel="stylesheet" href="../../css/game-master.css">
</head>

<body>
    <main class="game-shell">
        <header class="game-topbar"><a href="../../index.html" class="game-home-button">←</a>
            <div class="game-heading"><span class="game-heading-icon">🎈</span>
                <div>
                    <h1>Colored Objects</h1>
                    <p>Ages 2–4</p>
                </div>
            </div><button id="soundButton" class="game-sound-button">🔊</button>
        </header>
        <section id="startScreen" class="game-screen game-center-screen">
            <div class="game-start-icon">🎈</div>
            <h2>Ready to play?</h2>
            <p>Listen carefully and tap the right object.</p><button id="startButton" class="game-primary-button">Start
                Game</button>
        </section>
        <section id="playScreen" class="game-screen game-play-screen is-hidden">
            <div class="game-meta"><span id="roundLabel" class="game-round-label">Round 1 of 8</span><button
                    id="repeatButton" class="game-repeat-button">🔊 Hear Again</button></div>
            <h2 id="prompt" class="game-prompt"></h2>
            <div id="feedback" class="game-feedback" aria-live="polite"></div>
            <div id="objectChoices" class="game-choices"></div>
            <div class="game-progress-track">
                <div id="progressBar" class="game-progress-bar"></div>
            </div>
        </section>
        <section id="finishScreen" class="game-screen game-center-screen is-hidden">
            <div class="game-finish-icon">⭐</div>
            <h2>All done!</h2>
            <p>Great job!</p>
            <div class="game-finish-actions"><button id="playAgainButton" class="game-primary-button">Play
                    Again</button><a href="../../index.html" class="game-secondary-button">Home</a></div>
        </section>
        <div id="celebrationLayer" class="game-celebration-layer"></div>
    </main>
    <script src="../../js/game-common.js"></script>
    <script src="game.js"></script>
</body>

</html>
